# Local checks, so a mistake is caught in the second before the commit rather
# than in the minutes after the push.
#
#     uv sync
#     uv run pre-commit install
#
# Every hook is `repo: local` and runs its tool through `uv run --locked`: the
# versions pinned in uv.lock, from this project's .venv, whatever else is first
# on PATH. Nothing is cloned, there is no second set of tool versions to drift
# from the lock, and the commands are the ones CI runs. `--locked` also stops
# the hook when pyproject.toml has changed without `uv lock`.
#
# On commit: ruff and ty, about a second together.
# On push: the test suite. Skip either with `--no-verify` when you are
# committing work in progress.

# `language: unsupported` (the new name of `system`) arrived in 4.4.0.
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
    - repo: local
      hooks:
          - id: ruff-check
            name: ruff (lint)
            entry: uv run --locked ruff check --fix NLSE/ tests/ examples/
            language: unsupported
            # The command names its own paths, exactly as CI does, so it does
            # not matter which files are staged.
            pass_filenames: false
            types_or: [python, pyi, jupyter]

          - id: ruff-format
            name: ruff (format)
            entry: uv run --locked ruff format NLSE/ tests/ examples/
            language: unsupported
            pass_filenames: false
            types_or: [python, pyi, jupyter]

          - id: ty
            name: ty
            # Checks NLSE/ against ty-baseline.json; see [tool.ty] in pyproject.toml.
            entry: uv run --locked ty check
            language: unsupported
            pass_filenames: false
            # The package, its configuration, the baseline and the pinned ty.
            files: ^(NLSE/.*\.pyi?|pyproject\.toml|uv\.lock|ty-baseline\.json)$

          - id: uv-lock
            name: uv.lock matches pyproject.toml
            entry: uv lock --check
            language: unsupported
            pass_filenames: false
            files: ^(pyproject\.toml|uv\.lock)$

          - id: yaml-parses
            name: yaml parses
            entry: uv run --locked python -c "import sys,yaml;[yaml.safe_load(open(f)) for f in sys.argv[1:]]"
            language: unsupported
            files: \.(yml|yaml)$

          - id: notebooks-are-json
            name: notebooks are valid json
            entry: uv run --locked python -c "import sys,json;[json.load(open(f)) for f in sys.argv[1:]]"
            language: unsupported
            files: \.ipynb$

          - id: pytest
            name: pytest (excluding benchmarks)
            entry: uv run --locked pytest tests/ -q -m "not benchmark"
            language: unsupported
            pass_filenames: false
            stages: [pre-push]
            types_or: [python, pyi, jupyter, markdown]
