name: CI

env:
    # The uv every job installs; setup-uv would otherwise take the latest.
    SETUP_UV_VERSION: "0.13.9"

on:
    push:
    pull_request:
    # Weekly, and on demand, the docs job executes every example again.
    schedule:
        - cron: "17 4 * * 1"
    workflow_dispatch:

# A newer run of the same ref and event cancels the older one. The event is in
# the group so that the weekly run and a push to main never cancel each other.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv and Python
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  version: ${{ env.SETUP_UV_VERSION }}
                  python-version: "3.13"
                  enable-cache: true

            # Fails when pyproject.toml changed and uv.lock was not regenerated.
            - name: Check uv.lock is up to date
              run: uv lock --check

            - name: Run ruff linter
              run: uv run --locked --only-group dev ruff check NLSE/ tests/ examples/

            - name: Check code formatting with ruff
              run: uv run --locked --only-group dev ruff format --check NLSE/ tests/ examples/

    type-check:
        name: Type Checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv and Python
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  version: ${{ env.SETUP_UV_VERSION }}
                  python-version: "3.13"
                  enable-cache: true

            - name: Run ty
              run: uv run --locked ty check

    # The full matrix is twelve jobs, which is worth it before a merge and not
    # on every push to a working branch. Branches get one representative
    # configuration; PRs and the trunk get all of them.
    matrix-scope:
        name: Choose the test matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.choose.outputs.matrix }}
        steps:
            - id: choose
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ] \
                     || [ "${{ github.ref }}" = "refs/heads/main" ]; then
                      echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13"]}' >> "$GITHUB_OUTPUT"
                  else
                      echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.13"]}' >> "$GITHUB_OUTPUT"
                  fi

    test:
        name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        needs: matrix-scope
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix-scope.outputs.matrix) }}

        steps:
            - uses: actions/checkout@v5

            - name: Set up uv and Python ${{ matrix.python-version }}
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  version: ${{ env.SETUP_UV_VERSION }}
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies (with OpenCL)
              if: runner.os != 'Windows'
              run: uv sync --locked --extra opencl

            # Windows has no OpenCL SDK on the runners.
            - name: Install dependencies (without OpenCL)
              if: runner.os == 'Windows'
              run: uv sync --locked

            - name: Run tests with coverage
              run: |
                  uv run --no-sync pytest tests/ -v --cov=NLSE --cov-report=xml --cov-report=term -m "not benchmark"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false

    benchmark:
        name: Performance Benchmarks
        # Only where the history is comparable: the action tracks results
        # against previous runs, and a working branch is not that history.
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv and Python
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  version: ${{ env.SETUP_UV_VERSION }}
                  python-version: "3.13"
                  enable-cache: true

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies
              run: uv sync --locked --extra opencl

            - name: Run benchmarks
              run: |
                  uv run --no-sync pytest tests/ -m benchmark --benchmark-json=benchmark.json

            # The key must be unique per run, and the prefix must not be one
            # another cache in this job also matches.
            #
            # actions/cache skips its save step when the primary key hits
            # exactly, so a fixed key stores once and then never again: every
            # later run restored the *first* run's numbers, compared against
            # them, and threw the result away. The baseline was frozen at
            # whichever run happened to go first, so a cell slower than that
            # one run alerted on every commit afterwards and could not recover.
            # A unique key always misses and so always saves; restore-keys
            # brings back the most recent one, which makes the baseline the
            # previous commit on main -- what the alert is meant to be about.
            - name: Download previous benchmark data
              uses: actions/cache@v4
              with:
                  path: ./cache
                  key: ${{ runner.os }}-benchmark-history-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-benchmark-history-

            - name: Store benchmark results
              if: hashFiles('benchmark.json') != ''
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  tool: "pytest"
                  output-file-path: benchmark.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: false
                  # 1.4x, and it is the threshold rather than the number that
                  # matters here: see comment-on-alert below for why nothing
                  # is sent when it trips.
                  alert-threshold: "140%"
                  # No commit comment, and so no mail.
                  #
                  # Every alert this has ever raised was runner noise. The
                  # proof is 22c239d1, which changed mlx_kernels.py, one doc
                  # and one MLX test -- and MLX is not installed on this
                  # runner, which installs only the opencl extra. It cannot have moved
                  # a CPU or CL timing by any amount. It alerted on 38
                  # benchmarks, ratios 1.41 to 2.31, across both backends: the
                  # whole run was slow. b600d117 added only test files and
                  # alerted on one CL micro-kernel at 2.58x, whose standard
                  # deviation was 33x the previous run's.
                  #
                  # That is not a threshold that wants raising. Comparing
                  # absolute rates between two runs on two different shared
                  # machines cannot resolve the effects this is asked about,
                  # and the alerts arrive often enough to be filtered out --
                  # which is how a real one would be missed too.
                  #
                  # What decides whether a change ships is
                  # benchmarks/profile_backends.py --baseline <rev>, which
                  # interleaves both revisions in one session and reports, per
                  # cell, how far that cell moved between rounds of identical
                  # code. See docs/optimization-log.md, "How to measure".
                  #
                  # The numbers are still collected and still charted, and
                  # summary-always puts each run's table in the job summary,
                  # where it can be read on purpose rather than pushed.
                  comment-on-alert: false
                  summary-always: true
                  # Left false deliberately: a run that fails on runner noise
                  # gets ignored, and then so do the real alerts.
                  fail-on-alert: false
                  # Save cache between runs
                  external-data-json-path: ./cache/benchmark-data.json

    docs:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv and Python
              uses: astral-sh/setup-uv@v10.4.0
              with:
                  version: ${{ env.SETUP_UV_VERSION }}
                  python-version: "3.13"
                  enable-cache: true

            # The vortex precession example is an animation, and the gallery
            # writes it as an mp4 through ffmpeg -- a hundredth the size of the
            # base64 frame-by-frame alternative. Installed rather than assumed:
            # without it the build fails under -W.
            - name: Install ffmpeg
              run: sudo apt-get update && sudo apt-get install -y ffmpeg

            - name: Install dependencies
              run: uv sync --locked --no-default-groups --group docs

            # The gallery pages the last run executed: sphinx-gallery re-runs only
            # the examples whose source changed since (md5). The run id makes every
            # run save; restore-keys brings back the newest made with the same
            # uv.lock and examples/_output.py, so a change to either runs them all.
            - name: Restore the executed gallery
              uses: actions/cache@v4
              with:
                  path: docs/auto_examples
                  key: docs-gallery-${{ hashFiles('uv.lock', 'examples/_output.py') }}-${{ github.run_id }}
                  restore-keys: docs-gallery-${{ hashFiles('uv.lock', 'examples/_output.py') }}-

            # The page of an example deleted or renamed since would fail -W as a
            # document in no toctree.
            - name: Drop cached pages of deleted examples
              run: |
                  shopt -s nullglob
                  for page in docs/auto_examples/*.py; do
                      [ -e "examples/${page##*/}" ] || rm -v "${page%.py}".*
                  done

            # -W turns warnings into errors: a broken cross-reference or a page
            # missing from a toctree fails the build rather than shipping.
            # sphinx-gallery fails the build on an example that raises; the two it
            # never executes are excluded by filename_pattern in docs/conf.py.
            - name: Build the site
              env:
                  # True on the weekly and manual runs: every example executes, which
                  # proves they all still run against the current code.
                  RERUN_ALL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'True' || 'False' }}
              run: uv run --no-sync python -m sphinx -b html docs docs/_build/html -W --keep-going -D sphinx_gallery_conf.run_stale_examples=$RERUN_ALL

            # A broken internal link is caught above; a link to a file in the
            # repository is not, and the examples gallery had one for months.
            # Exit 1 is a link that is broken or timed out, which a host being
            # down also gives, so it only warns. Anything else is Sphinx failing.
            - name: Check external-facing links resolve
              run: |
                  status=0
                  uv run --no-sync python -m sphinx -b linkcheck docs docs/_build/linkcheck || status=$?
                  if [ "$status" -eq 1 ]; then
                      echo "::warning title=Links did not resolve::listed in this step's log"
                      cat docs/_build/linkcheck/output.txt
                  elif [ "$status" -ne 0 ]; then
                      exit "$status"
                  fi

            - name: Upload the site
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/_build/html

    deploy-docs:
        name: Deploy documentation
        needs: docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
