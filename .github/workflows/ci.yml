name: CI

env:
    # Keep the cache off the installed package; see NLSE.utils.get_cache_dir.
    NLSE_CACHE_DIR: ${{ github.workspace }}/.nlse-cache

on:
    push:
    pull_request:

# A branch that is also open as a PR fires both events. Keep the newest run
# and cancel the rest, rather than pay for the same commit twice.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv pip install --system ruff

            - name: Run ruff linter
              run: ruff check NLSE/ tests/ examples/

            - name: Check code formatting with ruff
              run: ruff format --check NLSE/ tests/ examples/

    type-check:
        name: Type Checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv pip install --system mypy -e .

            - name: Run mypy
              run: mypy NLSE/ --install-types --non-interactive

    # The full matrix is twelve jobs, which is worth it before a merge and not
    # on every push to a working branch. Branches get one representative
    # configuration; PRs and the trunk get all of them.
    matrix-scope:
        name: Choose the test matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.choose.outputs.matrix }}
        steps:
            - id: choose
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ] \
                     || [ "${{ github.ref }}" = "refs/heads/main" ] \
                     || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
                      echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13"]}' >> "$GITHUB_OUTPUT"
                  else
                      echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.13"]}' >> "$GITHUB_OUTPUT"
                  fi

    test:
        name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        needs: matrix-scope
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix-scope.outputs.matrix) }}

        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies (with OpenCL)
              if: runner.os != 'Windows'
              run: uv pip install --system -e ".[dev,opencl]"

            # Windows has no OpenCL SDK on the runners.
            - name: Install dependencies (without OpenCL)
              if: runner.os == 'Windows'
              run: uv pip install --system -e ".[dev]"

            - name: Cache backend benchmarks
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.nlse-cache
                  key: ${{ runner.os }}-py${{ matrix.python-version }}-nlse-cache

            - name: Run tests with coverage
              run: |
                  pytest tests/ -v --cov=NLSE --cov-report=xml --cov-report=term -m "not benchmark"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false

    benchmark:
        name: Performance Benchmarks
        # Only where the history is comparable: the action tracks results
        # against previous runs, and a working branch is not that history.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies
              run: uv pip install --system -e ".[dev,opencl]"

            - name: Cache backend benchmarks
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.nlse-cache
                  key: ${{ runner.os }}-benchmark-nlse-cache

            - name: Run benchmarks
              run: |
                  pytest tests/ -m benchmark --benchmark-json=benchmark.json || true

            - name: Download previous benchmark data
              uses: actions/cache@v4
              with:
                  path: ./cache
                  key: ${{ runner.os }}-benchmark

            - name: Store benchmark results
              if: hashFiles('benchmark.json') != ''
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  tool: "pytest"
                  output-file-path: benchmark.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: false
                  # Alert when a benchmark is 1.4x slower than its baseline.
                  #
                  # It was 200%, which is a benchmark taking twice as long --
                  # loose enough that nothing short of an accident would fire
                  # it. That was the right threshold for the measurement it
                  # had: every solver benchmark took ten steps whatever the
                  # backend, so on MLX 91% of the timing was the once-per-run
                  # setup rather than the solver. The step counts are
                  # calibrated per backend now (see BENCH_STEPS), and the
                  # run-to-run spread measured locally is 2.9% median, 8.5%
                  # worst. 1.4x leaves room for a shared CI runner being
                  # noisier than a quiet laptop while still catching anything
                  # that matters.
                  alert-threshold: "140%"
                  # Comment on PRs with benchmark comparison
                  comment-on-alert: true
                  # Left false deliberately: a run that fails on runner noise
                  # gets ignored, and then so do the real alerts.
                  fail-on-alert: false
                  # Save cache between runs
                  external-data-json-path: ./cache/benchmark-data.json
