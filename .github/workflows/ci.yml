name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install ruff

            - name: Run ruff
              run: ruff check NLSE/ tests/ examples/

            - name: Check code formatting with black
              run: ruff format NLSE/ tests/ examples/

    type-check:
        name: Type Checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install mypy
                  pip install -e .

            - name: Run mypy
              run: mypy NLSE/ --install-types --non-interactive

    test:
        name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12", "3.13"]

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Cache FFTW wisdom and benchmarks
              uses: actions/cache@v4
              with:
                  path: NLSE/.cache/
                  key: ${{ runner.os }}-py${{ matrix.python-version }}-nlse-cache

            - name: Run tests with coverage
              run: |
                  pytest tests/ -v --cov=NLSE --cov-report=xml --cov-report=term -m "not benchmark"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v4
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
              with:
                  file: ./coverage.xml
                  fail_ci_if_error: false

    benchmark:
        name: Performance Benchmarks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e ".[dev]"

            - name: Cache FFTW wisdom and benchmarks
              uses: actions/cache@v4
              with:
                  path: NLSE/.cache/
                  key: ${{ runner.os }}-benchmark-nlse-cache

            - name: Run benchmarks
              run: |
                  pytest tests/ -m benchmark --benchmark-only --benchmark-json=benchmark.json

            - name: Download previous benchmark data
              uses: actions/cache@v4
              with:
                  path: ./cache
                  key: ${{ runner.os }}-benchmark

            - name: Store benchmark results
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  tool: "pytest"
                  output-file-path: benchmark.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  # Push and deploy GitHub pages for main branch
                  auto-push: ${{ github.ref == 'refs/heads/main' }}
                  # Alert if performance degrades by 200%
                  alert-threshold: "200%"
                  # Comment on PRs with benchmark comparison
                  comment-on-alert: true
                  fail-on-alert: false
                  # Store results in gh-pages branch
                  gh-pages-branch: gh-pages
                  benchmark-data-dir-path: benchmarks
                  # Save cache between runs
                  external-data-json-path: ./cache/benchmark-data.json
