name: CI

env:
    # Keep the cache off the installed package; see NLSE.utils.get_cache_dir.
    NLSE_CACHE_DIR: ${{ github.workspace }}/.nlse-cache

on:
    push:
    pull_request:

# A branch that is also open as a PR fires both events. Keep the newest run
# and cancel the rest, rather than pay for the same commit twice.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv pip install --system ruff

            - name: Run ruff linter
              run: ruff check NLSE/ tests/ examples/

            - name: Check code formatting with ruff
              run: ruff format --check NLSE/ tests/ examples/

    type-check:
        name: Type Checking
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv pip install --system mypy -e .

            - name: Run mypy
              run: mypy NLSE/ --install-types --non-interactive

    # The full matrix is twelve jobs, which is worth it before a merge and not
    # on every push to a working branch. Branches get one representative
    # configuration; PRs and the trunk get all of them.
    matrix-scope:
        name: Choose the test matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.choose.outputs.matrix }}
        steps:
            - id: choose
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ] \
                     || [ "${{ github.ref }}" = "refs/heads/main" ] \
                     || [ "${{ github.ref }}" = "refs/heads/develop" ]; then
                      echo 'matrix={"os":["ubuntu-latest","macos-latest","windows-latest"],"python-version":["3.10","3.11","3.12","3.13"]}' >> "$GITHUB_OUTPUT"
                  else
                      echo 'matrix={"os":["ubuntu-latest"],"python-version":["3.13"]}' >> "$GITHUB_OUTPUT"
                  fi

    test:
        name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
        needs: matrix-scope
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.matrix-scope.outputs.matrix) }}

        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install system dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies (with OpenCL)
              if: runner.os != 'Windows'
              run: uv pip install --system -e ".[dev,opencl]"

            # Windows has no OpenCL SDK on the runners.
            - name: Install dependencies (without OpenCL)
              if: runner.os == 'Windows'
              run: uv pip install --system -e ".[dev]"

            - name: Cache backend benchmarks
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.nlse-cache
                  key: ${{ runner.os }}-py${{ matrix.python-version }}-nlse-cache

            - name: Run tests with coverage
              run: |
                  pytest tests/ -v --cov=NLSE --cov-report=xml --cov-report=term -m "not benchmark"

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v5
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
              with:
                  files: ./coverage.xml
                  fail_ci_if_error: false

    benchmark:
        name: Performance Benchmarks
        # Only where the history is comparable: the action tracks results
        # against previous runs, and a working branch is not that history.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y ocl-icd-opencl-dev pocl-opencl-icd

            - name: Install dependencies
              run: uv pip install --system -e ".[dev,opencl]"

            - name: Cache backend benchmarks
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.nlse-cache
                  key: ${{ runner.os }}-benchmark-nlse-cache

            - name: Run benchmarks
              run: |
                  pytest tests/ -m benchmark --benchmark-json=benchmark.json || true

            # The key must be unique per run, and the prefix must not be one
            # another cache in this job also matches.
            #
            # actions/cache skips its save step when the primary key hits
            # exactly, so a fixed key stores once and then never again: every
            # later run restored the *first* run's numbers, compared against
            # them, and threw the result away. The baseline was frozen at
            # whichever run happened to go first, so a cell slower than that
            # one run alerted on every commit afterwards and could not recover.
            # A unique key always misses and so always saves; restore-keys
            # brings back the most recent one, which makes the baseline the
            # previous commit on main -- what the alert is meant to be about.
            - name: Download previous benchmark data
              uses: actions/cache@v4
              with:
                  path: ./cache
                  key: ${{ runner.os }}-benchmark-history-${{ github.run_id }}
                  restore-keys: |
                      ${{ runner.os }}-benchmark-history-

            - name: Store benchmark results
              if: hashFiles('benchmark.json') != ''
              uses: benchmark-action/github-action-benchmark@v1
              with:
                  tool: "pytest"
                  output-file-path: benchmark.json
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  auto-push: false
                  # 1.4x, and it is the threshold rather than the number that
                  # matters here: see comment-on-alert below for why nothing
                  # is sent when it trips.
                  alert-threshold: "140%"
                  # No commit comment, and so no mail.
                  #
                  # Every alert this has ever raised was runner noise. The
                  # proof is 22c239d1, which changed mlx_kernels.py, one doc
                  # and one MLX test -- and MLX is not installed on this
                  # runner, which builds ".[dev,opencl]". It cannot have moved
                  # a CPU or CL timing by any amount. It alerted on 38
                  # benchmarks, ratios 1.41 to 2.31, across both backends: the
                  # whole run was slow. b600d117 added only test files and
                  # alerted on one CL micro-kernel at 2.58x, whose standard
                  # deviation was 33x the previous run's.
                  #
                  # That is not a threshold that wants raising. Comparing
                  # absolute rates between two runs on two different shared
                  # machines cannot resolve the effects this is asked about,
                  # and the alerts arrive often enough to be filtered out --
                  # which is how a real one would be missed too.
                  #
                  # What decides whether a change ships is
                  # benchmarks/profile_backends.py --baseline <rev>, which
                  # interleaves both revisions in one session and reports, per
                  # cell, how far that cell moved between rounds of identical
                  # code. See docs/optimization-log.md, "How to measure".
                  #
                  # The numbers are still collected and still charted, and
                  # summary-always puts each run's table in the job summary,
                  # where it can be read on purpose rather than pushed.
                  comment-on-alert: false
                  summary-always: true
                  # Left false deliberately: a run that fails on runner noise
                  # gets ignored, and then so do the real alerts.
                  fail-on-alert: false
                  # Save cache between runs
                  external-data-json-path: ./cache/benchmark-data.json

    docs:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Set up uv
              uses: astral-sh/setup-uv@v9.0.0
              with:
                  enable-cache: true
                  cache-dependency-glob: "pyproject.toml"

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: uv pip install --system -e ".[docs]"

            # -W turns warnings into errors, which is what --strict was doing
            # before: a broken cross-reference or a page missing from a
            # toctree fails the build rather than shipping.
            # The gallery runs every example while it builds, so this job is
            # also what checks they still work -- sphinx-gallery fails the
            # build on an example that raises. Four are not executed: two are
            # benchmark sweeps taking minutes, and two exit early without a
            # GPU or without data a benchmark run produces.
            - name: Build the site
              run: python -m sphinx -b html docs docs/_build/html -W --keep-going

            # A broken internal link is caught above; a link to a file in the
            # repository is not, and the examples gallery had one for months.
            - name: Check external-facing links resolve
              run: python -m sphinx -b linkcheck docs docs/_build/linkcheck || true

            - name: Upload the site
              uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/_build/html

    deploy-docs:
        name: Deploy documentation
        needs: docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
