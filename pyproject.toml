[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NLSE"
version = "2.3.0"
description = "A package for solving the Nonlinear Schrödinger Equation (NLSE) using the Split-Step Fourier method."
readme = "README.md"
authors = [{ name = "Tangui Aladjidi", email = "tangui.aladjidi@lkb.upmc.fr" }]
license = { text = "GPLv3" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Environment :: GPU :: NVIDIA CUDA :: 11",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numba",
  "numpy",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
opencl = ["pyopencl", "pyvkfft", "mako"]
gpu = ["cupy"]
mlx = ["mlx"]
# Building mkdocs-documentation/ needs these four; there was no way to say so.
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "mkdocs-jupyter"]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "pytest-benchmark",
  "ruff",
  "mypy",
  # Runs those two on commit and the suite on push; see .pre-commit-config.yaml
  "pre-commit",
  # Needed by tests/test_packaging.py, which builds a real wheel to verify
  # what ships. Without it the test would silently skip.
  "hatchling",
]

[project.urls]
Documentation = "https://taladjidi.github.io/NLSE/"
Homepage = "https://github.com/Quantum-Optics-LKB/NLSE"
Repository = "https://github.com/Quantum-Optics-LKB/NLSE"

# hatchling builds straight from the source tree into the archive. There is no
# build/lib staging directory to go stale and no egg-info file list to cache,
# which is what made setuptools ship modules from an older layout. It also
# includes non-Python files under the package, so the kernel templates that are
# read at runtime need no separate package-data entry.
[tool.hatch.build.targets.wheel]
packages = ["NLSE"]
exclude = ["*.pyc", "__pycache__", ".cache"]

[tool.hatch.build.targets.sdist]
include = ["NLSE", "tests", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["*.pyc", "__pycache__", ".cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "benchmark: mark test as a performance benchmark",
]

[tool.ruff]
src = ["NLSE"]
line-length = 88  # Enforce the default value

[tool.ruff.lint]
select = [
  "C",
  "E",
  "F",
  "W",
  "I",
  "C90",
  "RUF",
  "D",
]
extend-ignore = [
  "E501",
  "RUF012",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
follow_imports = "normal"
strict_optional = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"NLSE/utils.py" = ["F401"]  # Imports used for availability checking

# Skip type checking for solvers (multi-backend complexity)
[[tool.mypy.overrides]]
module = [
  "NLSE.solvers.*",
  "NLSE.kernels.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["NLSE"]
omit = [
  "*/tests/*",
  "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pass",
]
