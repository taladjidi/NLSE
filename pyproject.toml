[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "NLSE"
version = "4.1.0"
description = "A package for solving the Nonlinear Schrödinger Equation (NLSE) using the Split-Step Fourier method."
readme = "README.md"
authors = [{ name = "Tangui Aladjidi", email = "tangui.aladjidi@lkb.upmc.fr" }]
license = { text = "GPLv3" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU",
  "Environment :: GPU :: NVIDIA CUDA :: 11",
  "Environment :: GPU :: NVIDIA CUDA :: 12",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10"
dependencies = [
  "matplotlib",
  "numba",
  "numpy",
  "scipy",
  "tqdm",
]

[project.optional-dependencies]
opencl = ["pyopencl", "pyvkfft", "mako"]
gpu = ["cupy"]
mlx = ["mlx"]

[project.urls]
Documentation = "https://taladjidi.github.io/NLSE/"
Homepage = "https://github.com/taladjidi/NLSE"
Repository = "https://github.com/taladjidi/NLSE"

# Groups rather than extras: they are local to this repository and never part
# of the published metadata (PEP 735). `uv sync` installs dev by default; the
# docs build adds `--group docs`.
[dependency-groups]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "pytest-benchmark",
  "ruff",
  # Pinned: ty is pre-1.0, its diagnostics change between releases, and
  # ty-baseline.json is only valid for the release that wrote it.
  "ty==0.0.112",
  # Runs ruff and ty on commit and the suite on push; see .pre-commit-config.yaml
  "pre-commit>=4.4.0",
  # Needed by tests/test_packaging.py, which builds a real wheel to verify
  # what ships. Without it the test fails rather than checking nothing.
  "hatchling",
]
# Sphinx, because the maths, the notebook and the API reference all go
# through one renderer. sphinx-autoapi parses the source rather than
# importing it, which matters here: importing NLSE pulls in whichever
# backend is installed, and none of cupy, pyopencl or mlx is on a docs
# runner.
docs = [
  "sphinx",
  "furo",
  "myst-nb",
  "sphinx-autoapi",
  "sphinx-copybutton",
  "sphinx-gallery",
]

# hatchling builds straight from the source tree into the archive. There is no
# build/lib staging directory to go stale and no egg-info file list to cache,
# which is what made setuptools ship modules from an older layout. It also
# includes non-Python files under the package, so the kernel templates that are
# read at runtime need no separate package-data entry.
[tool.hatch.build.targets.wheel]
packages = ["NLSE"]

[tool.hatch.build.targets.sdist]
# Anchored with "/": a bare "LICENSE" also matched docs/_static/mathjax/LICENSE.
# No tests: they read docs/ and examples/, which the sdist does not carry.
include = ["/NLSE", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
markers = [
  "benchmark: mark test as a performance benchmark",
]

[tool.ruff]
src = ["NLSE"]
line-length = 88  # Enforce the default value
# Build artefacts. sphinx-gallery copies every example into the gallery
# directory and autoapi writes .rst next to it; linting a copy reports the
# same finding twice and against a file nobody edits.
extend-exclude = ["docs/auto_examples", "docs/api", "docs/_build"]

[tool.ruff.format]
# The pages align their comments by hand; the formatter would undo it.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "C",
  "E",
  "F",
  "W",
  "I",
  "C90",
  "RUF",
  "D",
  "UP",
  "PGH",
]
ignore = [
  "E501",
  "RUF012",
  "D100",
  "D102",
  "D103",
  "D104",
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"NLSE/utils.py" = ["F401"]  # Imports used for availability checking
# A gallery example opens with an reStructuredText document -- a title and
# its underline -- which sphinx-gallery reads as the page heading. That is
# not a numpy summary line, so the two rules that police one do not apply.
"examples/*.py" = ["D205", "D400"]

[tool.coverage.run]
source = ["NLSE"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  # Anchored: a bare "pass" also matched prose such as "passes".
  '^\s*pass\s*$',
]

[tool.ty]
# The diagnostics present when ty was adopted, recorded so that only new ones
# fail. Entries match on file, rule and columns, not line numbers: editing a
# recorded line reports it again. See docs/contributing.md for when to run
# `uv run ty check --update-baseline`. Preview feature: the file format is
# tied to the pinned ty release.
baseline = "ty-baseline.json"

[tool.ty.src]
# The package only. tests/, examples/ and benchmarks/ are not checked: most of
# what ty reports there is `**PARAMS` unpacked into a typed signature.
include = ["NLSE"]

[tool.ty.environment]
# Every backend is reachable on some OS; check them all whatever the host is.
python-platform = "all"

[tool.ty.analysis]
# Optional backends and numba: not installed everywhere (cupy, mlx), shipped
# without stubs (mlx.core is compiled), or typed in a way ty cannot follow
# (numba.prange). Their imports become Any, so the result does not depend on
# which extras the checking machine has.
replace-imports-with-any = [
  "cupy.**",
  "cupyx.**",
  "pyopencl.**",
  "pyvkfft.**",
  "mlx.**",
  "nvtx.**",
  "numba.**",
]
