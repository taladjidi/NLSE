[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NLSE"
version = "2.3.0"
description = "A package for solving the Nonlinear Schrödinger Equation (NLSE) using the Split-Step Fourier method."
readme = "README.md"
authors = [
    {name = "Tangui Aladjidi", email = "tangui.aladjidi@lkb.upmc.fr"}
]
license = {text = "GPLv3"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA :: 11",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "pyfftw",
    "numba",
    "pyvkfft",
    "pyopencl",
]

[project.optional-dependencies]
gpu = ["cupy"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "black",
    "mypy",
    "cupy",  # Include GPU support for dev
]

[project.urls]
Homepage = "https://github.com/Quantum-Optics-LKB/NLSE"
Repository = "https://github.com/Quantum-Optics-LKB/NLSE"
Documentation = "https://nlse.readthedocs.io"

[tool.setuptools.packages.find]
where = ["."]
include = ["NLSE*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "benchmark: mark test as a performance benchmark",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"NLSE/utils.py" = ["F401"]  # Imports used for availability checking

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = false
strict_equality = false
# Allow dynamic typing for multi-backend architecture
allow_redefinition = true
allow_untyped_calls = true
allow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pyfftw.*",
    "numba.*",
    "cupy.*",
    "cupyx.*",
    "pyopencl.*",
    "pyvkfft.*",
    "tqdm.*",
]
ignore_missing_imports = true

# Skip type checking for solvers (multi-backend complexity)
[[tool.mypy.overrides]]
module = [
    "NLSE.solvers.*",
    "NLSE.kernels.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["NLSE"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]
